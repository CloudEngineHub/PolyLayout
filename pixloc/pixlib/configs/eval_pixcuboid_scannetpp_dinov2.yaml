data:
  name: scannetpp
  max_num_points3D: 256
  num_views: 5
  resize_by: min
  resize: 512
  crop: false
  init_layout: cuboid_cameras
  batch_size: 6
  num_workers: 8
  seed: 1
  read_line_segments: true
model:
  name: cuboid_refiner
  success_thresh: 3
  duplicate_optimizer_per_scale: true
  point_sampling: guided
  num_points2D: 256
  pre_optimize_vp: true
  extractor:
    name: dinov2
    output_scales: [0, 2, 4]
    num_tokens: 1225
    checkpointed: true
  optimizer:
    name: cuboid_optimizer
    num_iters: 15
    loss_fn: scaled_barron(0, 0.1)
    edge_cost_scale: 0.05
    vp_cost_scale: 40.0
    vp_dist_thr: 0.05
    clamp_dd: 0.25
